<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Alpha Visual Artists…</title>
<style>
  body {
    background: #080808;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .wrap { max-width: 360px; }
  h1 { font-size: 22px; margin-bottom: 12px; font-weight: 700; }
  p { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
  a {
    display: inline-block;
    background: #00BFFF;
    color: #000;
    padding: 14px 28px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Opening your gallery…</h1>
  <p>Redirecting you to the Alpha Visual Artists app. If it doesn't open automatically, tap the button below.</p>
  <a id="open-btn" href="#">Open App</a>
</div>
<script>
  // Preserve the full hash/query (access_token, refresh_token, type, etc.)
  var hash = window.location.hash || window.location.search || '';
  var appUrl = 'ava://auth/callback' + hash;
  document.getElementById('open-btn').href = appUrl;
  // Auto-redirect on mobile — desktop users may not have the app
  var ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod|Android/i.test(ua)) {
    window.location.replace(appUrl);
  }
</script>
</body>
</html>
