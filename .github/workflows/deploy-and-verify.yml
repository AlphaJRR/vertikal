name: Deploy to Cloudflare Pages + Live Verification

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/workflows/deploy-and-verify.yml'
  workflow_dispatch:

jobs:
  validate-secrets:
    name: Validate Cloudflare credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            missing+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}. Add them at https://github.com/AlphaJRR/vertikal/settings/secrets/actions — see GITHUB_SECRETS_SETUP.md in the repo."
            exit 1
          fi
          echo "Cloudflare credentials present."

  deploy-main:
    name: Deploy vertikalapp.com
    runs-on: ubuntu-latest
    needs: validate-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./public \
            --project-name=vertikalapp \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy vertikalapp (${GITHUB_SHA::7})"

  deploy-creators:
    name: Deploy creators.vertikalapp.com
    runs-on: ubuntu-latest
    needs: validate-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./public/creators \
            --project-name=creators-vertikalapp \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy creators (${GITHUB_SHA::7})"

  deploy-investors:
    name: Deploy investors.vertikalapp.com
    runs-on: ubuntu-latest
    needs: validate-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./public/investors \
            --project-name=investors-vertikalapp \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy investors (${GITHUB_SHA::7})"

  deploy-networks:
    name: Deploy networks.vertikalapp.com
    runs-on: ubuntu-latest
    needs: validate-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./public/networks \
            --project-name=networks-vertikalapp \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy networks (${GITHUB_SHA::7})"

  live-verification:
    name: Live Verification Mode
    runs-on: ubuntu-latest
    needs: [deploy-main, deploy-creators, deploy-investors, deploy-networks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Live Verification
        run: node scripts/live-verification.js
